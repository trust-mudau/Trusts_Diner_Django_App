<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Browse the current menu at Trust's Diner.">
    <title>{% block title %}Trust's Diner{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <header class="bg-dark text-white py-3 mb-4">
        <div class="container d-flex align-items-center justify-content-between">
            <a href="{% url 'home' %}" class="h1 mb-0 text-white text-decoration-none">Trust's Diner</a>
            <nav aria-label="Primary navigation">
                <a href="{% url 'home' %}" class="text-white text-decoration-none">Menu</a>
            </nav>
        </div>
    </header>

    <main class="container flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">&copy; {% now "Y" %} Trust's Diner. All rights reserved.</p>
    </footer>
</body>
</html>
