{% extends "menu/base.html" %}

{% block title %}{{ item.name }} | Trust's Diner{% endblock %}

{% block content %}
        <a href="{% url 'home' %}" class="btn btn-outline-secondary mb-3">&larr; Back to menu</a>
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title">{{ item.name }}</h2>
                <h5 class="text-muted">R{{ item.price }}</h5>
                <p class="card-text mt-3">{{ item.description }}</p>
            </div>
        </div>
{% endblock %}
